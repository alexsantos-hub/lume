/* Extensão incremental: identificação bancária e sugestões de descrições */
.bank-mark{display:inline-grid;place-items:center;width:39px;height:39px;flex:none;border-radius:12px;background:#28364b;color:#fff;font-size:15px;font-weight:900;letter-spacing:-.8px;vertical-align:middle;border:1px solid #ffffff22}
.bank-mark.inter{background:#ff7b21;color:#fff}.bank-mark.nubank{background:#820ad1;color:#fff}.bank-mark.btg{background:#123973;color:#fff}.bank-mark.pay99{background:#f5c400;color:#111}.bank-mark.otherbank{background:#273c55;color:#d2e6ff}
.bank-name{display:flex;align-items:center;gap:12px}.bank-name h2{margin:0}.bank-mini{display:inline-flex;align-items:center;justify-content:center;vertical-align:middle;min-width:19px;height:19px;padding:0 3px;border-radius:5px;font-weight:900;font-size:10px;margin-right:5px}.bank-mini.inter{background:#ff7b21;color:white}.bank-mini.nubank{background:#820ad1;color:white}.bank-mini.btg{background:#123973;color:white}.bank-mini.pay99{background:#f5c400;color:#111}.bank-mini.otherbank{background:#314862;color:white}

<main class="page"><div class="top"><div><span class="eyebrow" id="pageSubtitle">PAINEL FINANCEIRO</span><h1 id="pageTitle">Visão geral</h1><p id="pageDesc">Seu dinheiro, suas decisões.</p></div><div class="actions" id="pageActions"></div></div><div id="app"></div></main>
</div><nav class="mobnav" id="navMobile"></nav>

<input type="file" id="importFile" accept="application/json,.json" hidden>
<input type="file" id="invoiceFile" accept=".pdf,.csv,application/pdf,text/csv,text/plain" hidden>

<script>
(()=>{'use strict';
const KEY='lume-financas-offline-v1',VERSION=1;
const fresh=()=>({version:VERSION,accounts:[],transactions:[],cards:[],purchases:[],payments:[],assets:[],events:[],otherAssets:[],liabilities:[],goals:[],snapshots:[],recurrences:[],recurrenceExceptions:[],categoryRules:[]});
const viewItems=[['home','▦','Painel'],['transactions','⇅','Lançamentos'],['accounts','▣','Contas'],['cards','▤','Cartões'],['assets','◈','Investimentos'],['payouts','◇','Proventos'],['balance','▥','Patrimônio'],['planning','◷','Planejamento'],['goals','◎','Metas'],['settings','⚙','Ajustes']];
let st=fresh(),persistent=true,currentView='home',searchTerm='',transKindFilter='all',assetFilter='all',cardCategoryFilter='all',month=localToday().slice(0,7),cardMonth=month,modalSave=null,invoiceFile=null,invoiceRows=[],invoiceMeta=null,invoiceCsvData=null;
const $=s=>document.querySelector(s),$$=s=>Array.from(document.querySelectorAll(s));
function localToday(){const d=new Date();return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`}
function esc(v){return String(v==null?'':v).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}
const fmt=(n)=>new Intl.NumberFormat('pt-BR',{style:'currency',currency:'BRL'}).format(Number(n)||0);
const num=(n)=>{let s=String(n==null?'':n).trim();if(s.includes(',')&&s.includes('.'))s=s.replace(/\./g,'').replace(',','.');else s=s.replace(',','.');return Number(s)||0};
const round=n=>Math.round((n+Number.EPSILON)*100)/100;
const uid=()=>typeof crypto!=='undefined'&&crypto.randomUUID?crypto.randomUUID():'id-'+Date.now()+'-'+Math.random().toString(36).slice(2);
const formatDate=s=>s?new Date(s+'T12:00:00').toLocaleDateString('pt-BR'):'—';
const formatMonth=s=>new Date(s+'-15T12:00:00').toLocaleDateString('pt-BR',{month:'long',year:'numeric'});
function monthAdd(m,d){const [y,mo]=m.split('-').map(Number);const x=new Date(y,mo-1+d,15);return `${x.getFullYear()}-${String(x.getMonth()+1).padStart(2,'0')}`}
function monthsBetween(a,b){const [ya,ma]=a.split('-').map(Number),[yb,mb]=b.split('-').map(Number);return (yb-ya)*12+mb-ma}
function moneyField(id,label,value='',attrs=''){return field(id,label,`<input name="${id}" id="f_${id}" inputmode="decimal" type="number" min="0" step="0.01" value="${esc(value)}" ${attrs}>`)}
function field(id,label,html,helper=''){return `<div class="field"><label for="f_${esc(id)}">${label}</label>${html}${helper?`<div class="help">${helper}</div>`:''}</div>`}
function textField(id,label,value='',required=true){return field(id,label,`<input id="f_${id}" name="${id}" maxlength="110" value="${esc(value)}" ${required?'required':''}>`)}
const KNOWN_DESCRIPTIONS=['Salário','Rendimento','Dividendos','Juros sobre capital próprio','Aluguel','Condomínio','Energia elétrica','Água','Internet','Telefone','Supermercado','Farmácia','Combustível','Transporte','Academia','Streaming','Restaurante','Plano de saúde','Educação','Seguro','IPVA','IPTU','Fatura do cartão','Transferência','Aporte em investimentos','Reembolso','Assinatura'];
function descriptionsField(id,label,value=''){const fromHistory=[...st.transactions.map(t=>t.description),...st.recurrences.map(r=>r.description),...st.purchases.map(p=>p.description)];const desc=[...new Set([...KNOWN_DESCRIPTIONS,...fromHistory].map(x=>String(x||'').trim()).filter(Boolean))].sort((a,b)=>a.localeCompare(b,'pt-BR'));return field(id,label,`<input id="f_${id}" name="${id}" maxlength="110" list="lume_descriptions" autocomplete="off" value="${esc(value)}" required><datalist id="lume_descriptions">${desc.map(x=>`<option value="${esc(x)}"></option>`).join('')}</datalist>`,'Digite ou escolha uma descrição sugerida; lançamentos anteriores também aparecem.');}
function bankFromName(name){const n=String(name||'').toLowerCase();if(/nubank|\bnu\b/.test(n))return 'nubank';if(/\bbtg\b/.test(n))return 'btg';if(/99\s?pay|99pay/.test(n))return 'pay99';if(/\binter\b/.test(n))return 'inter';return 'otherbank';}
function bankMark(a,small=false){const k=a?.bank||bankFromName(a?.name),label={inter:'Inter',nubank:'Nubank',btg:'BTG',pay99:'99 Pay',otherbank:'Conta'}[k]||'Conta',symbol={inter:'inter',nubank:'nu',btg:'BTG',pay99:'99',otherbank:'▣'}[k]||'▣';return `<span class="${small?'bank-mini':'bank-mark'} ${k}" title="${label}" aria-label="${label}">${symbol}</span>`;}

const options=(a,n)=>a.map(o=>[o.id,o[n]]);
function read(){try{let raw=localStorage.getItem(KEY);if(raw){let d=JSON.parse(raw);if(d&&d.version===VERSION){st={...fresh(),...d};if(!st._del||typeof st._del!=='object')st._del={};for(let k of Object.keys(fresh()).filter(k=>Array.isArray(fresh()[k])))if(!Array.isArray(st[k]))st[k]=[];}}localStorage.setItem('lume-probe','1');localStorage.removeItem('lume-probe')}catch(e){persistent=false;try{console.warn('Armazenamento não disponível',e)}catch(_){}}}
function save(){try{localStorage.setItem(KEY,JSON.stringify(st));persistent=true;try{window.LumeSync&&window.LumeSync.changed()}catch(_){}}catch(e){persistent=false;alert('Não foi possível gravar no armazenamento do navegador. Exporte seus dados em Ajustes para não perdê-los.')}renderNav();}
function snapshotIds(){const m={};for(const k of Object.keys(st))if(Array.isArray(st[k])){const mm=new Map();for(const x of st[k])if(x&&x.id){const {_u,...r}=x;mm.set(x.id,JSON.stringify(r))}m[k]=mm;}return m}
function stampChanges(before){const now=Date.now();if(!st._del||typeof st._del!=='object')st._del={};for(const k of Object.keys(st))if(Array.isArray(st[k])){const prev=before[k]||new Map(),seen=new Set();for(const x of st[k]){if(!x||!x.id)continue;seen.add(x.id);const {_u,...r}=x;if(prev.get(x.id)!==JSON.stringify(r))x._u=now;}for(const id of prev.keys())if(!seen.has(id))st._del[k+':'+id]=now;}}
function mutate(fn){const before=snapshotIds();fn();stampChanges(before);save();render()}
function byId(coll,id){return st[coll].find(x=>x.id===id)}
function accountName(id){return byId('accounts',id)?.name||'Conta removida'}
function cardName(id){return byId('cards',id)?.name||'Cartão removido'}
function assetName(id){return byId('assets',id)?.ticker||'Ativo removido'}
function accountBalance(id){const ac=byId('accounts',id);if(!ac)return 0;let n=num(ac.opening);for(let t of st.transactions){if(t.type==='income'&&t.accountId===id)n+=num(t.amount);if(t.type==='expense'&&t.accountId===id)n-=num(t.amount);if(t.type==='transfer'){if(t.accountId===id)n-=num(t.amount);if(t.toAccountId===id)n+=num(t.amount);}}for(let p of st.payments)if(p.accountId===id)n-=num(p.amount);for(let e of st.events)if(e.status==='received'&&e.accountId===id)n+=payoutNet(e);return round(n)}
const totalCash=()=>round(st.accounts.reduce((s,a)=>s+accountBalance(a.id),0));
function assetResult(a){const q=num(a.quantity),cost=q*num(a.avgPrice),hasPrice=num(a.price)>0,value=q*(hasPrice?num(a.price):num(a.avgPrice));return {cost,value,profit:hasPrice?value-cost:null,percent:hasPrice&&cost>0?(value-cost)/cost:null};}
const portfolioValue=()=>round(st.assets.reduce((s,a)=>s+num(a.quantity)*num(a.price||a.avgPrice),0));
const otherTotal=()=>round(st.otherAssets.reduce((t,x)=>t+num(x.amount),0));
const debtTotal=()=>round(st.liabilities.reduce((t,x)=>t+num(x.amount),0));
const totalAssets=()=>round(totalCash()+portfolioValue()+otherTotal());
const netWorth=()=>round(totalAssets()-debtTotal());
const rateFmt=x=>new Intl.NumberFormat('pt-BR',{style:'percent',minimumFractionDigits:1,maximumFractionDigits:1}).format(x);
let quoteToken='', quoteStatus='';
function installment(p,m){const ix=monthsBetween(p.firstMonth,m);if(ix<0||ix>=num(p.installments))return 0;const total=Math.round(num(p.total)*100),q=Math.floor(total/num(p.installments));return (ix===num(p.installments)-1?total-q*(num(p.installments)-1):q)/100}
function billTotal(cardId,m){return round(st.purchases.filter(p=>p.cardId===cardId).reduce((s,p)=>s+installment(p,m),0))}
function billPaid(cardId,m){return round(st.payments.filter(p=>p.cardId===cardId&&p.month===m).reduce((s,p)=>s+num(p.amount),0))}
function eligQty(e){return e.eligibleQty!==''&&e.eligibleQty!=null?num(e.eligibleQty):num(byId('assets',e.assetId)?.quantity)}
function payoutGross(e){return round(eligQty(e)*num(e.perUnit))}
function payoutNet(e){return round(payoutGross(e)*(1-num(e.taxRate)/100))}
function monthIncome(m){return round(st.transactions.filter(t=>t.type==='income'&&t.date.slice(0,7)===m).reduce((s,t)=>s+num(t.amount),0)+st.events.filter(e=>e.status==='received'&&e.accountId&&e.payDate?.slice(0,7)===m).reduce((s,e)=>s+payoutNet(e),0))}
function monthExpense(m){return round(st.transactions.filter(t=>t.type==='expense'&&t.date.slice(0,7)===m).reduce((s,t)=>s+num(t.amount),0)+st.purchases.reduce((s,p)=>s+installment(p,m),0))}

function home(){topbar('Visão geral','Acompanhe receitas, gastos, patrimônio e próximos proventos.',`<button class="btn primary" data-action="new-transaction">+ Lançamento</button>`,true);const inc=monthIncome(month),out=monthExpense(month),net=inc-out,up=st.events.filter(e=>e.status!=='received'&&e.payDate>=localToday()).sort((a,b)=>a.payDate.localeCompare(b.payDate)).slice(0,5);const recent=st.transactions.slice().sort((a,b)=>b.date.localeCompare(a.date)).slice(0,5);const range=Array.from({length:6},(_,i)=>monthAdd(month,i-5));const max=Math.max(1,...range.flatMap(m=>[monthIncome(m),monthExpense(m)]));const bars=range.map(m=>`<div class="bar-col"><div class="bar-stack"><div class="bar in" title="Receitas ${fmt(monthIncome(m))}" style="height:${Math.max(2,monthIncome(m)/max*100)}%"></div><div class="bar out" title="Despesas ${fmt(monthExpense(m))}" style="height:${Math.max(2,monthExpense(m)/max*100)}%"></div></div><span>${esc(new Date(m+'-15T12:00:00').toLocaleDateString('pt-BR',{month:'short'}))}</span></div>`).join('');let h=`<div class="grid kpis"><div class="tile"><div class="klabel">Saldo das contas</div><div class="kvalue">${fmt(totalCash())}</div><div class="ksub">Saldos locais calculados</div></div><div class="tile"><div class="klabel">Receitas do mês</div><div class="kvalue green">${fmt(inc)}</div><div class="ksub">Inclui proventos creditados</div></div><div class="tile"><div class="klabel">Despesas do mês</div><div class="kvalue red">${fmt(out)}</div><div class="ksub">Inclui parcelas das faturas</div></div><div class="tile"><div class="klabel">Resultado do mês</div><div class="kvalue ${net>=0?'green':'red'}">${fmt(net)}</div><div class="ksub">Receitas menos despesas</div></div></div>`;

h+=`<div class="grid g2" style="margin-top:17px"><section class="panel"><div class="panel-head"><h2>Últimos lançamentos</h2><button class="btn small" data-view="transactions">Ver todos →</button></div>${recent.length?recent.map(t=>txEntry(t)).join(''):empty('Nenhum lançamento','Registre sua primeira receita ou despesa.')}</section><section class="panel"><div class="panel-head"><h2>Próximos proventos</h2><button class="btn small" data-view="payouts">Ver agenda →</button></div>${up.length?up.map(e=>entry('↙','income',esc(assetName(e.assetId)),`${formatDate(e.payDate)} · ${e.certainty==='estimate'?'Estimativa':'Anunciado'} · ${e.eligibleQty==null?'posição atual':'qtd. informada'}`,`<span class="green">${fmt(payoutNet(e))}</span>`)).join(''):empty('Agenda vazia','Cadastre um ativo e um provento.')}</section></div>`;{const x=projected(month);h+=`<section class="panel" style="margin-top:17px"><div class="panel-head"><h2>Previsão de caixa • ${esc(formatMonth(month))}</h2><button class="btn small" data-view="planning">Abrir planejamento →</button></div><div class="grid g2"><div><div class="sub">A receber (recorrências pendentes)</div><div class="big-summary green">${fmt(x.waitingIn)}</div></div><div><div class="sub">A pagar (recorrências pendentes)</div><div class="big-summary red">${fmt(x.waitingOut)}</div></div></div><div class="sentinel">Valores previstos não alteram os saldos até serem efetivados.</div></section>`;}if(!persistent)h+=`<div class="data-warning" style="margin-top:18px">Armazenamento indisponível. Seus lançamentos podem se perder. Exporte os dados em Ajustes.</div>`;$('#app').innerHTML=h;}

// Distribuição do valor das parcelas de todas as faturas do mês por categoria.

 }
 const ranked=[...totals.entries()].sort((a,b)=>b[1]-a[1]);

 const categoryList=[...new Set(st.purchases.map(p=>p.category||'Outros'))].sort((a,b)=>a.localeCompare(b,'pt-BR'));
 const all=st.purchases.filter(p=>st.cards.some(c=>c.id===p.cardId)&&(cardCategoryFilter==='all'||(p.category||'Outros')===cardCategoryFilter)).sort((a,b)=>b.date.localeCompare(a.date));
 h+=`<section class="panel" style="margin-top:16px"><div class="panel-head"><h2>Compras registradas</h2><select id="cardCategoryFilter" aria-label="Filtrar categoria" style="max-width:200px"><option value="all">Todas as categorias</option>${categoryList.map(c=>`<option value="${esc(c)}" ${cardCategoryFilter===c?'selected':''}>${esc(c)}</option>`).join('')}</select></div>${all.length?all.map(p=>entry('▤','',esc(p.description),`${esc(cardName(p.cardId))} · <span class="tag">${esc(p.category||'Outros')}</span> · ${esc(p.installments)}x a partir de ${esc(formatMonth(p.firstMonth))}`,fmt(p.total),'Valor da compra',ed('purchase',p.id))).join(''):empty('Nenhuma compra nesta categoria','Troque o filtro ou cadastre uma compra.')}</section>`;

function recurrenceDates(r,m){
 const start=r.startDate||localToday(),end=r.endDate||'9999-12-31',first=m+'-01',last=m+'-'+new Date(Number(m.slice(0,4)),Number(m.slice(5,7)),0).getDate();
 if(last<start||first>end)return [];
 const results=[];let d=new Date(start+'T12:00:00');const stop=new Date(last+'T12:00:00');let guard=0;
 if(r.frequency==='monthly'||r.frequency==='yearly'){
  const [sy,sm,sd]=start.split('-').map(Number),[y,mo]=m.split('-').map(Number);
  if(r.frequency==='yearly'&&mo!==sm)return [];
  if(r.frequency==='monthly'&&(y<sy||(y===sy&&mo<sm)))return [];
  const day=Math.min(sd,new Date(y,mo,0).getDate());const date=m+'-'+String(day).padStart(2,'0');
  if(date>=start&&date<=end)return [date];return [];
 }
 if(r.frequency==='weekly'){
  const offset=Math.max(0,Math.floor((new Date(first+'T12:00:00')-d)/86400000/7));d.setDate(d.getDate()+offset*7);
  while(d<=stop&&guard++<8){const dt=d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');if(dt>=start&&dt<=end&&dt.slice(0,7)===m)results.push(dt);d.setDate(d.getDate()+7)}
 }return results;
}
function recurrenceEntries(m){
 return st.recurrences.flatMap(master=>recurrenceDates(master,m).flatMap(scheduledDate=>{
  // A exceção é associada à data original, não à data alterada no mês.
  const ex=st.recurrenceExceptions.find(x=>x.recurrenceId===master.id&&x.date===scheduledDate);
  if(ex?.deleted)return [];
  const r=ex?.changes?{...master,...ex.changes}:master;
  const date=ex?.changes?.dueDate||scheduledDate;
  const tx=st.transactions.find(t=>t.recurrenceId===master.id&&t.scheduledDate===scheduledDate);
  return [{r,date,scheduledDate,tx,adjusted:!!ex?.changes,status:tx?'done':'pending'}];
 })).sort((a,b)=>a.date.localeCompare(b.date)||a.r.description.localeCompare(b.r.description));
}

function editRecurrence(id){if(!reqAccount())return;const old=byId('recurrences',id);openModal(old?'Editar recorrência':'Nova recorrência',selectField('type','Tipo',[['expense','Despesa'],['income','Receita']],old?.type||'expense')+descriptionsField('description','Descrição',old?.description||'')+moneyField('amount','Valor previsto padrão (R$)',old?.amount||'','required')+selectField('frequency','Frequência',[['monthly','Mensal'],['weekly','Semanal'],['yearly','Anual']],old?.frequency||'monthly')+dateField('startDate','Primeira ocorrência / dia-base',old?.startDate||localToday())+dateField('endDate','Data de término (opcional)',old?.endDate||'',false)+selectField('accountId','Conta usada ao efetivar',accOptions(),old?.accountId||st.accounts[0]?.id)+textField('category','Categoria',old?.category||'Geral',false),f=>{
 const amount=num(val(f,'amount')),startDate=val(f,'startDate'),endDate=val(f,'endDate');if(!val(f,'description').trim()||!(amount>0))throw Error('Informe descrição e valor acima de zero.');if(endDate&&endDate<startDate)throw Error('A data final não pode preceder a inicial.');const obj={type:val(f,'type'),description:val(f,'description').trim(),amount,frequency:val(f,'frequency'),startDate,endDate,accountId:val(f,'accountId'),category:val(f,'category')||'Geral'};
 mutate(()=>{if(old)Object.assign(old,obj);else st.recurrences.push({id:uid(),...obj})});
 });}
function settleRecurrence(id,scheduledDate){
 const row=recurrenceEntries(scheduledDate.slice(0,7)).find(o=>o.r.id===id&&o.scheduledDate===scheduledDate);
 if(!row){alert('Esta ocorrência não está mais disponível.');return;}
 if(row.tx){alert('Esta ocorrência já foi efetivada.');return;}
 const r=row.r;
 openModal('Efetivar '+(r.type==='income'?'receita':'despesa'),descriptionsField('description','Descrição',r.description)+moneyField('amount','Valor realmente '+(r.type==='income'?'recebido':'pago')+' (R$)',r.amount,'required')+dateField('date','Data real do '+(r.type==='income'?'recebimento':'pagamento'),localToday())+selectField('accountId','Conta financeira',accOptions(),r.accountId),f=>{
  const amount=num(val(f,'amount'));
  if(!(amount>0)||!val(f,'description').trim())throw Error('Informe descrição e valor positivo.');
  if(st.transactions.some(t=>t.recurrenceId===id&&t.scheduledDate===scheduledDate))throw Error('Esta ocorrência já foi efetivada.');
  mutate(()=>st.transactions.push({id:uid(),recurrenceId:id,scheduledDate,type:r.type,description:val(f,'description').trim(),amount,date:val(f,'date'),accountId:val(f,'accountId'),toAccountId:'',category:r.category||'Geral'}));
 },'Confirmar efetivação');
}
function undoRecurrence(id,date){const t=st.transactions.find(t=>t.recurrenceId===id&&t.scheduledDate===date);if(!t)return;if(!confirm('Desfazer a efetivação? O lançamento real será excluído e o saldo da conta será revertido.'))return;mutate(()=>st.transactions=st.transactions.filter(x=>x.id!==t.id));}

function editOccurrence(id,scheduledDate){
 const row=recurrenceEntries(scheduledDate.slice(0,7)).find(o=>o.r.id===id&&o.scheduledDate===scheduledDate);
 if(!row)return;
 const r=row.r,tx=row.tx;
 const note=tx?'Esta ocorrência já foi efetivada. As alterações serão feitas somente no lançamento financeiro selecionado, sem modificar a regra nem os outros meses.':'A alteração valerá somente para esta ocorrência. A regra recorrente, os demais meses e seus lançamentos não serão modificados.';
 openModal('Editar somente esta ocorrência',`<div class="field full"><div class="note">${note}</div></div>`+
  selectField('type','Tipo',[['expense','Despesa'],['income','Receita']],tx?.type||r.type)+
  descriptionsField('description','Descrição',tx?.description||r.description)+
  moneyField('amount',tx?'Valor efetivado (R$)':'Valor previsto (R$)',tx?.amount??r.amount,'required')+
  dateField('date',tx?'Data do lançamento efetivado':'Vencimento desta ocorrência',tx?.date||row.date)+
  selectField('accountId','Conta financeira',accOptions(),tx?.accountId||r.accountId)+
  textField('category','Categoria',tx?.category||r.category||'Geral',false),f=>{
   const description=val(f,'description').trim(),amount=num(val(f,'amount')),
    date=val(f,'date'),type=val(f,'type'),accountId=val(f,'accountId'),category=val(f,'category').trim()||'Geral';
   if(!description||!(amount>0)||!/^\d{4}-\d{2}-\d{2}$/.test(date)||!Number.isFinite(new Date(date+'T12:00:00').getTime()))throw Error('Informe descrição, valor positivo e uma data válida.');
   // Datas movidas para outro mês alterariam a competência virtual. Mantemos a exceção na competência original.
   if(!tx&&date.slice(0,7)!==scheduledDate.slice(0,7))throw Error('O vencimento precisa ficar no mesmo mês. Para alterar a competência, edite a regra de recorrência.');
   if(!byId('accounts',accountId))throw Error('Selecione uma conta válida.');
   mutate(()=>{
    if(tx){Object.assign(tx,{type,description,amount,date,accountId,category,toAccountId:''});}
    else{
     st.recurrenceExceptions=st.recurrenceExceptions.filter(x=>!(x.recurrenceId===id&&x.date===scheduledDate));
     st.recurrenceExceptions.push({id:uid(),recurrenceId:id,date:scheduledDate,changes:{type,description,amount,accountId,category,dueDate:date}});
    }
   });
  },'Salvar somente esta');
}
function deleteOccurrence(id,scheduledDate){
 const master=byId('recurrences',id);if(!master)return;
 const row=recurrenceEntries(scheduledDate.slice(0,7)).find(o=>o.r.id===id&&o.scheduledDate===scheduledDate);
 if(!row)return;
 const posted=!!row.tx;
 const note=posted?'Esta ocorrência foi efetivada: ao excluir somente esta ocorrência, o lançamento financeiro correspondente também será excluído, revertendo seu efeito no saldo.':'Excluir somente esta ocorrência cancela apenas este compromisso; os outros meses seguem normalmente.';
 openModal('Excluir compromisso',`<div class="field full"><div class="note"><b>${esc(row.r.description)}</b> · ${formatDate(row.date)}<div style="margin-top:7px">${note}</div></div></div>`+
  selectField('scope','O que deseja excluir?', [['single','Somente esta ocorrência'],['series','Toda a série recorrente (todas as previsões)']],'single')+
  `<div class="field full"><div class="help">Ao excluir toda a série, a regra e suas previsões deixam de aparecer. Os lançamentos financeiros já efetivados em outros meses são preservados.</div></div>`,f=>{
   const scope=val(f,'scope');
   if(scope==='series'&&!confirm('Excluir a recorrência inteira, inclusive as previsões de outros meses? Os lançamentos já efetivados serão preservados.'))return;
   mutate(()=>{
    if(scope==='single'){
     // Apenas a transação originada desta ocorrência é removida, se existir.
     st.transactions=st.transactions.filter(t=>!(t.recurrenceId===id&&t.scheduledDate===scheduledDate));
     st.recurrenceExceptions=st.recurrenceExceptions.filter(x=>!(x.recurrenceId===id&&x.date===scheduledDate));
     st.recurrenceExceptions.push({id:uid(),recurrenceId:id,date:scheduledDate,deleted:true});
    }else if(scope==='series'){
     st.recurrences=st.recurrences.filter(r=>r.id!==id);
     st.recurrenceExceptions=st.recurrenceExceptions.filter(x=>x.recurrenceId!==id);
    }
   });
  },'Confirmar exclusão');
}

// Leitor de faturas PDF do Banco Inter: os dados e a senha nunca entram no backup.
const PDFJS_SCRIPT='https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js';
const PDFJS_WORKER='https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';
let pdfLoadPromise=null;
function loadPdfReader(){
 if(window.pdfjsLib)return Promise.resolve(window.pdfjsLib);
 if(!pdfLoadPromise)pdfLoadPromise=new Promise((resolve,reject)=>{
  const script=document.createElement('script');script.src=PDFJS_SCRIPT;script.async=true;
  script.onload=()=>window.pdfjsLib?resolve(window.pdfjsLib):reject(Error('O leitor de PDF não foi inicializado.'));
  script.onerror=()=>reject(Error('Não foi possível carregar o leitor de PDF. Verifique a internet e tente novamente.'));
  document.head.appendChild(script);
 }).catch(e=>{pdfLoadPromise=null;throw e});
 return pdfLoadPromise;
}

function normalizeInvText(v){return String(v||'').normalize('NFD').replace(/[\u0300-\u036f]/g,'').toLowerCase().replace(/[^a-z0-9]+/g,' ').trim()}
function invMoney(v){return Math.round(Number(String(v).replace(/[^0-9,.-]/g,'').replace(/\./g,'').replace(',','.'))*100)/100}
function invoiceParseDate(raw,billMonth){
 let s=normalizeInvText(raw),d=0,m=0,y=0;
 const slash=s.match(/^(\d{1,2})\s+(\d{1,2})(?:\s+(\d{2,4}))?$/);
 if(slash){d=+slash[1];m=+slash[2];y=+(slash[3]||0)}
 else{
  const z=s.match(/^(\d{1,2})\s+(?:de\s+)?(jan|fev|mar|abr|mai|jun|jul|ago|set|out|nov|dez)\w*\s*(\d{4})?$/);
  if(!z)return null;
  d=+z[1];m=['jan','fev','mar','abr','mai','jun','jul','ago','set','out','nov','dez'].indexOf(z[2])+1;y=+(z[3]||0);
 }
 if(y&&y<100)y+=2000;
 if(!y){const yy=Number(billMonth.slice(0,4)),mo=Number(billMonth.slice(5,7));y=[yy-1,yy,yy+1].sort((a,b)=>Math.abs((a*12+m)-(yy*12+mo))-Math.abs((b*12+m)-(yy*12+mo)))[0];}
 const date=`${String(y).padStart(4,'0')}-${String(m).padStart(2,'0')}-${String(d).padStart(2,'0')}`;
 const dt=new Date(date+'T12:00:00');return dt.getFullYear()===y&&dt.getMonth()===m-1&&dt.getDate()===d?date:null;
}

const GATEWAY_PREFIXES=['pg','mp','dl','ec','htm','asa','ckt','bmb','ig','wps','pag','pagseguro','pagbank','ebanx','paypal','sumup','stone','cielo','getnet','ecommerce','ecomm','mercado','mercadopago'];
function normalizeRuleText(v){return normalizeInvText(v)}
// Limpa a descrição para comparação: remove "•••• 2832", "- Parcela 3/10", "(Parcela 02 de 06)", números de loja soltos.
function merchantText(description){
 let d=normalizeInvText(description);
 d=d.replace(/\bparcela\s*\d+\s*(de)?\s*\d+\b/g,' ').replace(/^\d{3,4}\s+/,' ').replace(/\s+/g,' ').trim();
 return d;
}
function matchesCategoryRule(description,rule){
 const d=merchantText(description),term=normalizeRuleText(rule.pattern);
 if(!term)return false;
 if(rule.mode==='prefix'){
  if(d.startsWith(term))return true;
  const words=d.split(' ');
  // Permite "PG *99", "MP *Loja", "DL*Uber": testa também depois do intermediador de pagamento.
  for(let i=0;i<Math.min(2,words.length-1);i++){if(GATEWAY_PREFIXES.includes(words[i])&&words.slice(i+1).join(' ').startsWith(term))return true;}
  return false;
 }
 if(rule.mode==='word')return (' '+d+' ').includes(' '+term+' ');
 return d.includes(term);
}
function categoryForDescription(description){
 const personal=(Array.isArray(st.categoryRules)?st.categoryRules:[]).slice().reverse();
 for(const r of personal)if(matchesCategoryRule(description,r))return r.category;

 return 'Outros';
}

function categorizeOlderPurchases(){
 // Categorias genéricas (ou criadas por versões antigas das regras) podem ser reclassificadas. Categorias escolhidas por você ficam como estão.

 const pc=st.purchases.filter(p=>generic.has(normalizeInvText(p.category))&&categoryForDescription(p.description)!=='Outros'&&categoryForDescription(p.description)!==p.category);
 const tc=st.transactions.filter(t=>t.type==='expense'&&generic.has(normalizeInvText(t.category))&&categoryForDescription(t.description)!=='Outros'&&categoryForDescription(t.description)!==t.category);
 const rc=st.recurrences.filter(r=>r.type==='expense'&&generic.has(normalizeInvText(r.category))&&categoryForDescription(r.description)!=='Outros'&&categoryForDescription(r.description)!==r.category);

// Importação local de CSV, inclusive arquivos com ; , tabulação, aspas e cabeçalhos alternativos.
function csvParseDelimited(text,delimiter){
 const table=[];let row=[],cell='',quoted=false;
 for(let i=0;i<text.length;i++){
  const c=text[i];
  if(c==='"'){if(quoted&&text[i+1]==='"'){cell+='"';i++;}else quoted=!quoted;}
  else if(c===delimiter&&!quoted){row.push(cell);cell='';}
  else if((c==='\n'||c==='\r')&&!quoted){if(c==='\r'&&text[i+1]==='\n')i++;row.push(cell);if(row.some(x=>x.trim()))table.push(row);row=[];cell='';}
  else cell+=c;
 }
 row.push(cell);if(row.some(x=>x.trim()))table.push(row);
 return table;
}
function csvColumnIndex(headers,kind){
 const sets={date:[/^data\s*(da\s*)?(compra|transacao|movimentacao|lancamento|operacao)/,/^purchase date$/,/^transaction date$/,/^date$/,/^data$/,/^data/],
 description:[/^descricao/,/^estabelecimento/,/^comerciante/,/^merchant/,/^historico/,/^lancamento/,/^transacao/,/^detalhe/,/^identificacao/,/^nome/,/^title$/,/^memo$/],
 amount:[/^valor\s*(da\s*)?(compra|parcela|transacao|lancamento|total)/,/^valor$/,/^amount/,/^value$/,/^price/,/^debito$/, /total/],
 type:[/^tipo$/, /^natureza$/, /^operacao$/, /^situacao$/, /^type$/]};
 const norm=headers.map(normalizeInvText);
 for(const rx of sets[kind]){const i=norm.findIndex(h=>rx.test(h));if(i!==-1)return i;}
 return -1;
}
function csvAnalyzeTable(text){
 if(text.charCodeAt(0)===0xfeff)text=text.slice(1);
 let best=null;
 for(const delimiter of [';',',','\t','|']){
  const rows=csvParseDelimited(text,delimiter);if(rows.length>15000)throw Error('O CSV tem mais de 15.000 linhas. Divida em arquivos menores.');if(!rows.length)continue;
  const candidates=rows.slice(0,12).map((r,i)=>{
   const score=['date','description','amount'].filter(k=>csvColumnIndex(r,k)>=0).length;
   return {i,score};
  }).sort((a,b)=>b.score-a.score);
  const c=candidates[0];
  const head=c.score>=2?rows[c.i]:null;
  const count=(head||rows[0]).length;
  const regular=rows.slice(c.score>=2?c.i+1:0,Math.min(rows.length,30)).filter(r=>r.length===count).length;
  const score=c.score*25+Math.min(count,12)*2+regular;
  if(count>=3&&(!best||score>best.score))best={score,rows,headerIndex:head?c.i:-1,headers:head||Array.from({length:count},(_,i)=>`Coluna ${i+1}`)};
 }
 if(!best)throw Error('O CSV não tem colunas suficientes para data, descrição e valor.');
 const head=best.headerIndex>=0;
 return {rows:best.rows.slice(head?best.headerIndex+1:0),headers:best.headers,headerDetected:head,
  map:{date:csvColumnIndex(best.headers,'date'),description:csvColumnIndex(best.headers,'description'),amount:csvColumnIndex(best.headers,'amount'),type:csvColumnIndex(best.headers,'type')}};
}
function csvMoney(raw){
 let v=String(raw??'').trim();if(!v)return NaN;
 const negative=/^\s*[-−]/.test(v)||/\([^)]*\)/.test(v);
 v=v.replace(/[^0-9,\.]/g,'');if(!v)return NaN;
 const dot=v.lastIndexOf('.'),comma=v.lastIndexOf(',');
 if(dot>=0&&comma>=0){v=(comma>dot?v.replace(/\./g,'').replace(',','.'):v.replace(/,/g,''));}
 else if(comma>=0){const parts=v.split(',');v=parts.length===2&&parts[1].length===3?parts.join(''):parts.slice(0,-1).join('')+'.'+parts.at(-1);}
 else if(dot>=0){const parts=v.split('.');v=parts.length===2&&parts[1].length===3?parts.join(''):parts.slice(0,-1).join('')+'.'+parts.at(-1);}
 const n=Number(v);return Number.isFinite(n)?(negative?-n:n):NaN;
}
function csvDate(raw,billMonth){
 const str=String(raw||'').trim();
 const iso=str.match(/^(\d{4})[-/](\d{1,2})[-/](\d{1,2})(?:\b|\s|T)/);
 if(iso){const dt=`${iso[1]}-${iso[2].padStart(2,'0')}-${iso[3].padStart(2,'0')}`;
  const d=new Date(dt+'T12:00:00');return d.getFullYear()===Number(iso[1])&&d.getMonth()===Number(iso[2])-1&&d.getDate()===Number(iso[3])?dt:null;}
 return invoiceParseDate(str.split(/\s+\d{1,2}:\d{2}/)[0],billMonth);
}

function parseInterInvoiceLines(textLines,billMonth){
 const rows=[];
 let inCharges=false,foundSection=false,buffer='';
 for(const original of textLines){
  let line=String(original||'').replace(/\s+/g,' ').trim();
  if(!line)continue;
  const normalized=normalizeInvText(line);
  if(/despesas da fatura|lancamentos da fatura|detalhamento de compras/.test(normalized)){inCharges=true;foundSection=true;buffer='';continue;}
  if(inCharges&&/^(proxima fatura|limite de credito|resumo da fatura|faturas futuras|informacoes importantes|resumo financeiro|encargos do periodo)/.test(normalized)){inCharges=false;continue;}
  if(foundSection&&!inCharges)continue;
  if(/^(data movimentacao|cartao\s+\d|total cartao|valor total|total da fatura|saldo|pagamento|despesas do mes|fatura atual|valor antecipado)/.test(normalized))continue;
  // Preserva sinais +/−, pois créditos/estornos não são compras.
  const money=line.match(/(?:([+\-−])\s*)?(?:R\$\s*)?(\d{1,3}(?:\.\d{3})*,\d{2}|\d+,\d{2})\s*$/);
  const dmatch=line.match(/^((?:\d{1,2}\s*[\/-]\s*\d{1,2}(?:\s*[\/-]\s*\d{2,4})?)|(?:\d{1,2}\s+(?:de\s+)?(?:jan|fev|mar|abr|mai|jun|jul|ago|set|out|nov|dez)[a-zç.]*\s*(?:\d{4})?))\s+(.+)$/i);
  if(dmatch&&money){
   const date=invoiceParseDate(dmatch[1],billMonth),amount=invMoney(money[2]);
   let descr=dmatch[2].slice(0,dmatch[2].length-money[0].length).trim().replace(/^[+\-−]\s*/,'').replace(/\s*[-−]\s*$/,'').trim();
   if(date&&descr&&amount>0&&!/^(pagamento|estorno|credito|total|saldo|amortizacao|antecipacao|devolucao)/i.test(normalizeInvText(descr)) && money[1]!=='+'){
    const partial=descr.match(/(?:\(|\s)(\d{1,2})\s*\/\s*(\d{1,2})(?:\))?\s*$/);
    rows.push({date,description:descr,amount,portion:partial?`${partial[1]}/${partial[2]}`:'',sourceLine:line});
   }
   buffer='';continue;
  }
  // Alguns PDFs quebram a linha antes do valor; une somente um par de linhas.
  if(buffer){const join=buffer+' '+line;buffer='';const found=parseInterInvoiceLines([join],billMonth);if(found.length){rows.push(...found);continue;}}
  if(dmatch&&!money){buffer=line;}
 }
 return rows;
}
async function readInvoicePdf(){
 if(!invoiceFile){invoiceStatus('Selecione a fatura em PDF antes de continuar.',true);return;}
 const cardId=$('#invoiceCard').value,billMonth=$('#invoiceMonth').value,password=$('#invoicePassword').value;
 if(!/^\d{4}-\d{2}$/.test(billMonth)){invoiceStatus('Informe um mês de referência válido.',true);return;}
 const btn=document.querySelector('[data-action="read-invoice-file"]');if(btn){btn.disabled=true;btn.textContent='Lendo PDF…';}
 invoiceStatus('Abrindo o PDF e procurando a tabela de lançamentos…');
 try{
  const lib=await loadPdfReader();lib.GlobalWorkerOptions.workerSrc=PDFJS_WORKER;
  const bytes=new Uint8Array(await invoiceFile.arrayBuffer());
  // A senha só existe nesta chamada; não é gravada no histórico nem no armazenamento.
  const job=lib.getDocument({data:bytes,password:password||undefined,useSystemFonts:true});
  // Alguns PDFs pedem a senha via callback e deixam a leitura pendente até recebê-la.
  let signalPassword;
  const passwordNeeded=new Promise((_,reject)=>{signalPassword=reject});
  job.onPassword=()=>{const err=Error(password?'Senha incorreta.':'Este PDF precisa de senha.');err.name='PasswordException';signalPassword(err);Promise.resolve(job.destroy?.()).catch(()=>{});};
  const doc=await Promise.race([job.promise,passwordNeeded]);
  if(doc.numPages>35)throw Error('A fatura tem mais de 35 páginas e excede o limite deste importador.');
  const lines=[];
  for(let p=1;p<=doc.numPages;p++){
   const page=await doc.getPage(p),tc=await page.getTextContent(),groups=[];
   for(const item of tc.items){if(!item.str||!item.str.trim())continue;const x=Number(item.transform?.[4]||0),y=Number(item.transform?.[5]||0);
    let g=groups.find(g=>Math.abs(g.y-y)<=2.8);if(!g){g={y,items:[]};groups.push(g);}g.items.push({x,str:item.str});}
   groups.sort((a,b)=>b.y-a.y);for(const g of groups){g.items.sort((a,b)=>a.x-b.x);lines.push(g.items.map(i=>i.str).join(' ').replace(/\s+/g,' ').trim());}
  }
  try{await doc.destroy()}catch(_){}
  if(!lines.length)throw Error('Este PDF não contém texto selecionável. Pode ser um PDF escaneado; esta versão não usa OCR.');
  const parsed=parseInterInvoiceLines(lines,billMonth);

// Compara compras por cartão, competência, data, descrição e centavos, respeitando
// quantidades: duas compras iguais no mesmo dia são duas ocorrências legítimas.
function invoicePurchaseKey(item,cardId,billMonth){
 return JSON.stringify([cardId,billMonth,item.date,normalizeInvText(item.description),Math.round(Number(item.amount)*100)]);
}
function invoicePortion(description){
 const m=String(description||'').match(/(?:\(|\s)(\d{1,2})\s*\/\s*(\d{1,2})\)?\s*$/);
 return m?{current:Number(m[1]),total:Number(m[2]),base:normalizeInvText(String(description).slice(0,m.index))}:null;
}
function invoiceMatchesExisting(rows,cardId,billMonth){
 const purchases=st.purchases.filter(p=>p.cardId===cardId&&(p.firstMonth===billMonth||(Number(p.installments)>1&&monthsBetween(p.firstMonth,billMonth)>=0&&monthsBetween(p.firstMonth,billMonth)<Number(p.installments))));
 const consumed=new Set();
 return rows.map((r,i)=>{
  const original=invoiceRows[i]||r;
  const originalKey=invoicePurchaseKey(original,cardId,billMonth);
  const editedKey=invoicePurchaseKey(r,cardId,billMonth);
  const legacyKey=`inter:${billMonth}:${i}:${normalizeInvText(original.sourceLine)}`;
  const sourcePortion=invoicePortion(original.description),editedPortion=invoicePortion(r.description);
  // Primeiro identificadores originais: permanecem válidos se a compra foi editada no Lume.
  let found=purchases.find(p=>!consumed.has(p.id)&&(p.pdfFingerprint===originalKey||(p.pdfImportKey&&p.pdfImportKey===legacyKey)));
  // Compras anteriores à atualização e compras avulsas inseridas manualmente.
  if(!found)found=purchases.find(p=>{
   if(consumed.has(p.id)||Number(p.installments||1)!==1||p.firstMonth!==billMonth)return false;
   const key=invoicePurchaseKey({date:p.date,description:p.description,amount:num(p.total)},cardId,billMonth);
   return key===originalKey||key===editedKey;
  });
  // Compra parcelada cadastrada manualmente: apenas a parcela da competência em questão.
  if(!found)found=purchases.find(p=>{
   if(consumed.has(p.id)||Number(p.installments||1)<=1)return false;
   const part=editedPortion||sourcePortion;
   if(!part||part.total!==Number(p.installments))return false;
   const ix=monthsBetween(p.firstMonth,billMonth);
   if(ix<0||ix>=Number(p.installments)||part.current!==ix+1)return false;
   return p.date===r.date&&normalizeInvText(p.description)===part.base&&Math.abs(installment(p,billMonth)-Number(r.amount))<0.005;
  });
  if(found)consumed.add(found.id);
  return !!found;
 });
}

function confirmInvoiceImport(){

  const fingerprint=invoicePurchaseKey(original,cardId,billMonth);

}

function backupPayload(){return JSON.stringify({...st,exportedAt:new Date().toISOString()},null,2)}
function offerBackupFallback(text,filename,reason){
 // Último recurso: link clicável (gesto do usuário) + copiar o JSON. Funciona mesmo quando o navegador bloqueia downloads automáticos.
 const url=URL.createObjectURL(new Blob([text],{type:'application/json'}));
 openModal('Salvar backup manualmente',`<div class="field full"><div class="note">${reason?esc(reason)+'<br><br>':''}Clique no botão abaixo para baixar o arquivo <b>${esc(filename)}</b>. Se nada acontecer, use “Copiar JSON”, cole no Bloco de Notas e salve com a extensão <b>.json</b>.</div></div>
 <div class="field full" style="display:flex;gap:8px;flex-wrap:wrap"><a class="btn primary" id="backupLink" href="${url}" download="${esc(filename)}">↓ Baixar ${esc(filename)}</a><a class="btn secondary" id="backupLink2" href="data:application/json;charset=utf-8,${encodeURIComponent(text)}" download="${esc(filename)}">↓ Baixar (modo alternativo)</a><button type="button" class="btn secondary" id="backupCopy">Copiar JSON</button></div>
 <div class="field full"><div class="help">No Edge: se o arquivo não aparecer, aperte <b>Ctrl+J</b> e veja se o download foi bloqueado — clique em “Manter”. Diagnóstico: seletor de pasta ${typeof window.showSaveFilePicker==='function'?'disponível':'indisponível'} · ${location.protocol}</div></div>
 <div class="field full"><textarea id="backupText" readonly style="width:100%;height:140px;font-family:monospace;font-size:11px">${esc(text)}</textarea></div>`,()=>{},'Fechar');
 ['#backupLink','#backupLink2'].forEach(id=>$(id).addEventListener('click',()=>{setTimeout(()=>{$(id).textContent='✓ Download solicitado — confira com Ctrl+J'},50)}));
 $('#backupCopy').addEventListener('click',async()=>{const ta=$('#backupText');try{await navigator.clipboard.writeText(text)}catch(_){ta.select();document.execCommand('copy')}$('#backupCopy').textContent='✓ Copiado';});
 $('#modal').addEventListener('close',()=>setTimeout(()=>URL.revokeObjectURL(url),1000),{once:true});
}
function downloadBackup(text,filename){
 try{const url=URL.createObjectURL(new Blob([text],{type:'application/json'})),a=document.createElement('a');a.href=url;a.download=filename;a.rel='noopener';a.style.display='none';document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),60000);return true;}catch(e){console.warn('Download falhou',e);return false;}
}
async function exportData(){
 const filename=`lume-backup-${localToday()}.json`;
 let text;
 try{text=backupPayload();}catch(e){alert('Não foi possível gerar o backup: '+(e?.message||e));return;}
 let inFrame=false;try{inFrame=window.self!==window.top}catch(_){inFrame=true}
 if(typeof window.showSaveFilePicker==='function'&&!inFrame){
  let handle;
  // Etapa 1: escolher onde salvar. Só aqui o AbortError significa "usuário cancelou".
  try{
   const opts={suggestedName:filename,types:[{description:'Backup Lume em JSON',accept:{'application/json':['.json']}}]};
   try{handle=await window.showSaveFilePicker({...opts,id:'lumebackup'});}
   catch(e){if(e?.name==='AbortError')throw e;handle=await window.showSaveFilePicker(opts);}
  }catch(e){
   if(e?.name==='AbortError')return;
   console.warn('Seletor de arquivos indisponível:',e);
   handle=null;
  }
  // Etapa 2: gravar. Qualquer erro aqui (inclusive AbortError do Google Drive/OneDrive) cai no plano B, nunca em silêncio.
  if(handle){
   let writer;
   try{
    writer=await handle.createWritable();
    await writer.write(text);
    await writer.close();
    const saved=await handle.getFile().catch(()=>null);
    if(saved&&saved.size===0)throw Error('o arquivo ficou vazio após a gravação');
    alert(`Backup salvo com sucesso: ${handle.name||filename}.`);
    return;
   }catch(e){
    try{await writer?.abort()}catch(_){}
    console.warn('Falha ao gravar na pasta escolhida:',e);
    offerBackupFallback(text,filename,`O navegador não conseguiu gravar na pasta escolhida (${e?.name||'erro'}: ${e?.message||''}). Isso acontece com frequência em pastas do Google Drive para desktop ou OneDrive.`);
    return;
   }
  }
 }
 // Navegadores sem seletor (Firefox, Safari) ou página aberta dentro de outra janela.
 offerBackupFallback(text,filename,inFrame?'A página está aberta dentro de outra janela, que pode bloquear downloads.':'Seu navegador não permite escolher a pasta diretamente. O arquivo irá para a pasta de Downloads (ou o Edge perguntará onde salvar, se essa opção estiver ativada).');
}
async function importData(file){if(!file)return;if(file.size>10*1024*1024){alert('O backup é maior que 10 MB.');return;}return importText(await file.text());}
function importText(text){let data;try{data=JSON.parse(String(text).trim())}catch(e){alert('Não foi possível ler o JSON. Confira se copiou o conteúdo inteiro, do { inicial ao } final.');return false;}const arrays=['accounts','transactions','cards','purchases','payments','assets','events'];const more=['otherAssets','liabilities','goals','snapshots','recurrences','recurrenceExceptions','categoryRules'];if(!data||data.version!==VERSION||!arrays.every(k=>Array.isArray(data[k]))||arrays.some(k=>data[k].length>100000||data[k].some(x=>!x||typeof x!=='object'||!x.id))){alert('Backup inválido ou versão incompatível. Nenhuma informação foi alterada.');return;}if(!confirm('Restaurar backup? Todos os dados atuais serão substituídos pelos registros do arquivo.'))return;st={...fresh(),...Object.fromEntries([...arrays,...more].map(k=>[k,Array.isArray(data[k])?data[k]:[]]))};{const now=Date.now();st._del={};for(const k of Object.keys(st))if(Array.isArray(st[k]))for(const x of st[k])if(x&&typeof x==='object')x._u=x._u||now;}save();setView('home');alert('Backup restaurado.');}
function reset(){if(!confirm('Tem certeza? Isso apagará todos os dados deste aplicativo neste navegador.'))return;const s=prompt('Digite APAGAR para confirmar:');if(s!=='APAGAR')return;{const now=Date.now(),del={...(st._del||{})};for(const k of Object.keys(st))if(Array.isArray(st[k]))for(const x of st[k])if(x&&x.id)del[k+':'+x.id]=now;st=fresh();st._del=del;}save();setView('home');}
function actions(e){const nav=e.target.closest('[data-view]');if(nav){setView(nav.dataset.view);return}const button=e.target.closest('[data-action]');if(!button)return;const act=button.dataset.action,id=button.dataset.id;if(act==='previous-month'){month=monthAdd(month,-1);render()}else if(act==='next-month'){month=monthAdd(month,1);render()}else if(act==='previous-cardmonth'){cardMonth=monthAdd(cardMonth,-1);render()}else if(act==='next-cardmonth'){cardMonth=monthAdd(cardMonth,1);render()}else if(act==='new-account')editAccount();else if(act==='new-transaction')editTransaction();else if(act==='new-recurrence')editRecurrence();else if(act==='settle-recurrence')settleRecurrence(id,button.dataset.date);else if(act==='undo-recurrence')undoRecurrence(id,button.dataset.date);else if(act==='edit-occurrence')editOccurrence(id,button.dataset.date);else if(act==='delete-occurrence')deleteOccurrence(id,button.dataset.date);else if(act==='import-invoice')openInvoiceImporter();else if(act==='choose-invoice-file')$('#invoiceFile').click();else if(act==='read-invoice-file')readInvoiceFile();else if(act==='process-invoice-csv')processInvoiceCsv();else if(act==='manage-category-rules')manageCategoryRules();else if(act==='categorize-older-purchases')categorizeOlderPurchases();else if(act==='remove-category-rule'){if(confirm('Excluir esta regra pessoal de classificação?')){mutate(()=>{st.categoryRules=st.categoryRules.filter(r=>r.id!==id)});if($('#modal').open)closeModal();}}else if(act==='cancel-invoice')closeInvoice();else if(act==='confirm-invoice')confirmInvoiceImport();else if(act==='new-card')editCard();else if(act==='new-purchase')editPurchase(null,id);else if(act==='pay-bill')payBill(id);else if(act==='new-asset')editAsset();else if(act==='buy-asset')buyAsset(id);else if(act==='new-payout')editPayout(null,id);else if(act==='new-other')editOther();else if(act==='new-debt')editDebt();else if(act==='new-goal')editGoal();else if(act==='snapshot')saveSnapshot();else if(act==='quote document.addEventListener('click',actions);document.addEventListener('input',e=>{if(e.target?.id==='txSearch'){searchTerm=e.target.value;const a=st.transactions.filter(t=>t.date.slice(0,7)===month&&(transKindFilter==='all'||t.type===transKindFilter)&&((t.description+' '+(t.category||'')).toLowerCase().includes(searchTerm.toLowerCase()))).sort((a,b)=>b.date.localeCompare(a.date));$('#transactionsRows').innerHTML=a.length?a.map(t=>txEntry(t,true)).join(''):empty('Sem resultados','Tente outra busca.');}});document.addEventListener('change',e=>{if(e.target?.id==='txType'){transKindFilter=e.target.value;render()}else if(e.target?.id==='assetFilter'){assetFilter=e.target.value;render()}else if(e.target?.id==='cardCategoryFilter'){cardCategoryFilter=e.target.value;render()}});
